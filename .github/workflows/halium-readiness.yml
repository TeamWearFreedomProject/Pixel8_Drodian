name: Droidian Phase 2 - Halium readiness (BUILD ONLY)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "upstream-only is quick; config-build recompiles Google's shusky tree to inspect .config"
        type: choice
        required: true
        default: upstream-only
        options:
          - upstream-only
          - config-build

permissions:
  contents: read

concurrency:
  group: halium-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    name: Halium audit / ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_DIR: ${{ github.workspace }}/sources
      GOOGLE_DIR: ${{ github.workspace }}/google-kernel
    steps:
      - name: Checkout audit scripts
        uses: actions/checkout@v4

      - name: Verify audit script Python syntax
        shell: bash
        run: |
          python3 -m py_compile scripts/audit_halium.py

      - name: Fetch official Droidian sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$SOURCE_DIR"
          git clone -q --depth=1 -b 6.1-android-common https://github.com/droidian-devices/common_fragments.git "$SOURCE_DIR/common_fragments"
          git clone -q --depth=1 -b droidian https://github.com/droidian-devices/linux-android-common-6.1-android14.git "$SOURCE_DIR/linux-android-common-6.1-android14"
          git clone -q --depth=1 https://github.com/droidian/android-system-gsi-34-bin.git "$SOURCE_DIR/android-system-gsi-34-bin"
          git -C "$SOURCE_DIR/common_fragments" rev-parse HEAD
          git -C "$SOURCE_DIR/linux-android-common-6.1-android14" rev-parse HEAD
          git -C "$SOURCE_DIR/android-system-gsi-34-bin" rev-parse HEAD

      - name: Install Google kernel build dependencies
        if: inputs.mode == 'config-build'
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ca-certificates cpio curl dwarves file flex git libelf-dev libssl-dev lz4 python3 rsync unzip xz-utils zip zstd
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build Google shusky for actual config comparison
        if: inputs.mode == 'config-build'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GOOGLE_DIR"
          cd "$GOOGLE_DIR"
          "$HOME/bin/repo" init --depth=1 -u https://android.googlesource.com/kernel/manifest -b android-gs-shusky-6.1-android16
          "$HOME/bin/repo" sync -c -j4 --no-tags --no-clone-bundle 2>&1 | tee "$GITHUB_WORKSPACE/sync.log"
          "$HOME/bin/repo" manifest -r -o "$GITHUB_WORKSPACE/google-manifest.xml"
          test -f ./build_shusky.sh
          bash ./build_shusky.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          test -s ./out/shusky/dist/.config
          cp ./out/shusky/dist/.config "$GITHUB_WORKSPACE/google-built.config"

      - name: Audit Halium configuration requirements
        shell: bash
        run: |
          set -euxo pipefail
          args=(--sources "$SOURCE_DIR" --output "$GITHUB_WORKSPACE/halium-report.md")
          if [[ "${{ inputs.mode }}" == "config-build" ]]; then
            args+=(--config "$GITHUB_WORKSPACE/google-built.config")
          fi
          python3 scripts/audit_halium.py "${args[@]}"
          cat "$GITHUB_WORKSPACE/halium-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload BUILD ONLY diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halium-readiness-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            halium-report.md
            google-built.config
            google-manifest.xml
            sync.log
            build.log
          if-no-files-found: warn
          retention-days: 7
