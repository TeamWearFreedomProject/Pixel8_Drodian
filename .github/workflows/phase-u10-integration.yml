name: Pixel 8 Ubuntu U10 - systemd integration + shiba readiness (VM ONLY)

on:
  workflow_dispatch:
  push:
    paths:
      - PHASE_U10.md

permissions:
  contents: read
  actions: read

concurrency:
  group: u10-qemu-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-systemd-integration:
    name: Integrate tested U8 initramfs with Ubuntu U6; execute real systemd unit in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout Pixel8_Drodian integration tests
        uses: actions/checkout@v4

      - name: Install host and ARM64 offline VM tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            qemu-system-arm qemu-user-static e2fsprogs lz4 cpio binutils file
          python3 -m py_compile scripts/u10_prepare_vm.py scripts/u10_vm_assert.py
          mkdir -p inputs/u6 inputs/u8 inputs/kernel build/ramdisk output
          df -h /

      - name: Fetch validated U6 Ubuntu 26.04 ARM64 ext4 rootfs
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38047914957
          name: shiba-u6-ubuntu-ext4-NOT_BOOTABLE-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/u6

      - name: Fetch validated U8 research ramdisk with static ARM64 BusyBox
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38052743722
          name: shiba-u8-initramfs-RESEARCH-DO_NOT_FLASH-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/u8

      - name: Fetch compiled U9 successful generic QEMU-only ARM64 kernel
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38059787754
          name: u9-generic-qemu-arm64-kernel-6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/kernel

      - name: Verify prior artifacts and prepare disposable VM-only systemd test rootfs
        shell: bash
        env:
          U6: inputs/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img
          U8: inputs/u8/u8-ubuntu-rootfs-handoff-UNVERIFIED-INITRAMFS_ONLY.cpio.lz4
          KERNEL: inputs/kernel/build/linux-6.6.89/arch/arm64/boot/Image
        run: |
          set -euxo pipefail
          echo "d3cbe5e0a0e170e9e1e3071b32394e0ddd686887351ed1f4aa2b8bed814bde9e  $U6" | sha256sum -c -
          echo "dc50919b6a4e89dc8c27d84dee5335105c756573ef3dcf74c3465a414e50372b  $U8" | sha256sum -c -
          echo "718c5584d0a1a69943c68689c0dadbd9b0ce6623e48e9a1b97429293c41efddc  $KERNEL" | sha256sum -c -
          python3 scripts/u10_prepare_vm.py \
            --u6 "$U6" \
            --output build/U10_QEMU_TEMP_NOT_PIXEL8_ROOTFS.img \
            --work output
          # The test rootfs has a temporary VM-only systemd unit; the original U6 is unchanged.
          stat -c '%n %s' "$U6" build/U10_QEMU_TEMP_NOT_PIXEL8_ROOTFS.img

      - name: Repack U8 first-stage and independently verify custom ARM64 read-only UUID probe
        shell: bash
        run: |
          set -euxo pipefail
          lz4 -dc inputs/u8/u8-ubuntu-rootfs-handoff-UNVERIFIED-INITRAMFS_ONLY.cpio.lz4 > build/u8-original.cpio
          (cd build/ramdisk && cpio --extract --make-directories --no-absolute-filenames --quiet < ../u8-original.cpio)
          test -x build/ramdisk/bin/busybox
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -Werror -static \
            scripts/u9_rootfs_probe.c -o build/ramdisk/bin/u8-rootfs-probe
          readelf -h build/ramdisk/bin/u8-rootfs-probe | grep -F AArch64
          if readelf -l build/ramdisk/bin/u8-rootfs-probe | grep -q INTERP; then
            echo "::error::probe is not static"
            exit 1
          fi
          qemu-aarch64-static build/ramdisk/bin/u8-rootfs-probe \
            d6b067e7-31e4-4aa3-8edf-d7e70fec0747 --image \
            "$GITHUB_WORKSPACE/build/U10_QEMU_TEMP_NOT_PIXEL8_ROOTFS.img"
          # Reuse guarded U8 entrypoint, add only QEMU progress markers.
          python3 - <<'PY'
          from pathlib import Path
          data=Path('scripts/u8_init').read_text()
          replace=[
            ('export PATH=/bin:/sbin','export PATH=/bin:/sbin\necho U10_INIT_STARTED'),
            ('exec "$BB" switch_root /newroot /sbin/init',
             'echo U10_REACHED_SWITCH_ROOT\nexec "$BB" switch_root /newroot /sbin/init')
          ]
          for old,new in replace:
            if old not in data: raise SystemExit('Cannot instrument U8 source: '+old)
            data=data.replace(old,new,1)
          Path('build/ramdisk/init').write_text(data)
          Path('build/ramdisk/init').chmod(0o755)
          PY
          sh -n build/ramdisk/init
          qemu-aarch64-static build/ramdisk/bin/busybox sh -n build/ramdisk/init
          (cd build/ramdisk && find . -print0 | LC_ALL=C sort -z |
            cpio --null --create --format=newc --quiet) |
            lz4 -l -z -c > build/u10-QEMU-ONLY.cpio.lz4
          test -s build/u10-QEMU-ONLY.cpio.lz4

      - name: Real Linux and Ubuntu systemd integration test in QEMU virt
        shell: bash
        run: |
          set -euxo pipefail
          set +e
          timeout -k 5 85 qemu-system-aarch64 \
            -M virt,gic-version=3 -cpu cortex-a72 -smp 2 -m 2048 \
            -nodefaults -display none -monitor none -serial stdio -nic none -no-reboot \
            -kernel inputs/kernel/build/linux-6.6.89/arch/arm64/boot/Image \
            -initrd build/u10-QEMU-ONLY.cpio.lz4 \
            -drive if=none,format=raw,readonly=on,file=build/U10_QEMU_TEMP_NOT_PIXEL8_ROOTFS.img,id=u10disk \
            -device virtio-blk-device,drive=u10disk \
            -append 'console=ttyAMA0,115200 earlycon=pl011,0x9000000 loglevel=5 rdinit=/init u8.rootuuid=d6b067e7-31e4-4aa3-8edf-d7e70fec0747 u8.research_gate=I_UNDERSTAND_THIS_IS_UNVERIFIED systemd.unit=u10-vm-smoke.target systemd.log_target=console' \
            > output/U10_QEMU_SERIAL.log 2>&1
          rc=$?
          set -e
          echo "QEMU_EXIT=$rc" > output/U10_QEMU_EXIT.txt
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::error::QEMU failed unexpectedly with exit code $rc"
            tail -n 100 output/U10_QEMU_SERIAL.log
            exit 1
          fi
          grep -E 'U10_|systemd\[1\]|Welcome to Ubuntu|Failed to' output/U10_QEMU_SERIAL.log | tail -n 50 || true

      - name: Strictly validate guest PID1-run systemd proof unit from console log
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/u10_vm_assert.py \
            --log output/U10_QEMU_SERIAL.log \
            --u6 inputs/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img \
            --guest-rootfs build/U10_QEMU_TEMP_NOT_PIXEL8_ROOTFS.img \
            --kernel inputs/kernel/build/linux-6.6.89/arch/arm64/boot/Image \
            --initramfs build/u10-QEMU-ONLY.cpio.lz4 \
            --out output
          cat output/U10_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Store boot evidence and reports ONLY, never flashable images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-u10-qemu-systemd-integration-evidence-${{ github.run_number }}
          path: |
            output/U10_REPORT.md
            output/U10_ASSERT.json
            output/U10_ROOTFS_PREP.json
            output/U10_QEMU_SERIAL.log
            output/U10_QEMU_EXIT.txt
          if-no-files-found: warn
          retention-days: 30

  shiba-android16-compatibility-gate:
    name: Pin shiba source and reject flash-ready claims without actual KMI evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout offline readiness gate
        uses: actions/checkout@v4

      - name: Fetch previous experimental shiba U7 boot (research only)
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38050847238
          name: shiba-u7-EXPERIMENTAL-boot-init_boot-DO_NOT_FLASH-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/u7

      - name: Pin public Android 16 Evolution X sources, not exact phone firmware
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p sources output
          git clone -q --depth=1 --branch bka \
            https://github.com/Evolution-X-Devices/device_google_shusky.git sources/shusky
          git clone -q --depth=1 --branch bka \
            https://github.com/Evolution-X-Devices/device_google_zuma.git sources/zuma
          test "$(git -C sources/shusky rev-parse HEAD)" = \
            56006ae8162db285e776d85319d9942945b87194
          test "$(git -C sources/zuma rev-parse HEAD)" = \
            fba447c6317f23501dbac209b6479e458800c449
          python3 scripts/u10_shiba_readiness.py \
            --sources sources \
            --boot inputs/u7/boot.img \
            --out output
          grep -Fq "device boot is STILL BLOCKED" output/U10_SHIBA_READINESS.md
          cat output/U10_SHIBA_READINESS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save source/firmware compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-u10-android16-readiness-${{ github.run_number }}
          path: |
            output/U10_SHIBA_READINESS.md
            output/U10_SHIBA_READINESS.json
          if-no-files-found: warn
          retention-days: 30
