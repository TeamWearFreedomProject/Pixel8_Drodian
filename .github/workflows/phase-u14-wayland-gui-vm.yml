name: Pixel 8 Ubuntu U14 - real ARM64 Labwc Wayland GUI (QEMU HEADLESS ONLY)

on:
  workflow_dispatch:
  push:
    paths:
      - PHASE_U14.md

permissions:
  contents: read
  actions: read

concurrency:
  group: u14-qemu-headless-gui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qemu-real-wayland:
    name: Actual Ubuntu systemd -> Labwc -> Wayland registry response in QEMU (NO PIXEL)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout U14 build-only tests
        uses: actions/checkout@v4

      - name: Install host and cross-build tools for guest ARM64 Wayland handshake
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            qemu-system-arm qemu-user-static e2fsprogs lz4 cpio binutils file
          python3 -m py_compile scripts/u14_prepare_gui_vm.py scripts/u14_assert_gui_vm.py
          sh -n scripts/u14_gui_vm.sh
          mkdir -p inputs/u6 inputs/u8 inputs/kernel build/ramdisk output
          df -h /

      - name: Fetch the real audited U6 Ubuntu 26.04 ARM64 GUI rootfs
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38047914957
          name: shiba-u6-ubuntu-ext4-NOT_BOOTABLE-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/u6

      - name: Fetch U8 ARM64 BusyBox bootloader-independent research initramfs
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38052743722
          name: shiba-u8-initramfs-RESEARCH-DO_NOT_FLASH-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/u8

      - name: Fetch U9 generic QEMU-only Linux ARM64 kernel (NOT shiba firmware)
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38059787754
          name: u9-generic-qemu-arm64-kernel-6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/kernel

      - name: SHA256-verify all prior proven inputs (original IMG remains immutable)
        shell: bash
        run: |
          set -euxo pipefail
          echo 'd3cbe5e0a0e170e9e1e3071b32394e0ddd686887351ed1f4aa2b8bed814bde9e  inputs/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img' | sha256sum -c -
          echo 'dc50919b6a4e89dc8c27d84dee5335105c756573ef3dcf74c3465a414e50372b  inputs/u8/u8-ubuntu-rootfs-handoff-UNVERIFIED-INITRAMFS_ONLY.cpio.lz4' | sha256sum -c -
          echo '718c5584d0a1a69943c68689c0dadbd9b0ce6623e48e9a1b97429293c41efddc  inputs/kernel/build/linux-6.6.89/arch/arm64/boot/Image' | sha256sum -c -

      - name: Compile actual static AArch64 Wayland client for protocol verification
        shell: bash
        run: |
          set -euxo pipefail
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -Werror -static \
            scripts/u14_wayland_probe.c -o build/u14-wayland-probe
          readelf -h build/u14-wayland-probe | grep -F AArch64
          if readelf -l build/u14-wayland-probe | grep -q INTERP; then
            echo '::error::Wayland probe unexpectedly dynamically linked'
            exit 1
          fi
          set +e
          qemu-aarch64-static build/u14-wayland-probe > output/U14_PROBE_NEGATIVE.log 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 2 ] || exit 1
          sha256sum build/u14-wayland-probe | tee output/U14_PROBE_SHA256.txt

      - name: Make disposable VM-only Ubuntu rootfs copy containing REAL Labwc test
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/u14_prepare_gui_vm.py \
            --u6 inputs/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img \
            --output build/U14_QEMU_TEMP_GUI_ROOTFS_NOT_PIXEL8.img \
            --probe build/u14-wayland-probe \
            --gui-script scripts/u14_gui_vm.sh \
            --work output
          test -s build/U14_QEMU_TEMP_GUI_ROOTFS_NOT_PIXEL8.img
          test "$(stat -c %s build/U14_QEMU_TEMP_GUI_ROOTFS_NOT_PIXEL8.img)" = 2147483648

      - name: Repack U8 guarded initramfs with VM progress instrumentation ONLY
        shell: bash
        run: |
          set -euxo pipefail
          lz4 -dc inputs/u8/u8-ubuntu-rootfs-handoff-UNVERIFIED-INITRAMFS_ONLY.cpio.lz4 > build/u8-original.cpio
          (cd build/ramdisk && cpio --extract --make-directories --no-absolute-filenames --quiet < ../u8-original.cpio)
          test -x build/ramdisk/bin/busybox
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -Werror -static \
            scripts/u9_rootfs_probe.c -o build/ramdisk/bin/u8-rootfs-probe
          python3 - <<'PY'
          from pathlib import Path
          data=Path('scripts/u8_init').read_text()
          changes=[
            ('export PATH=/bin:/sbin','export PATH=/bin:/sbin\necho U14_FIRST_STAGE_STARTED'),
            ('exec "$BB" switch_root /newroot /sbin/init',
             'echo U14_REACHED_SWITCH_ROOT\nexec "$BB" switch_root /newroot /sbin/init')
          ]
          for old,new in changes:
            if old not in data: raise SystemExit('U14 instrumentation cannot find: '+old)
            data=data.replace(old,new,1)
          Path('build/ramdisk/init').write_text(data)
          Path('build/ramdisk/init').chmod(0o755)
          PY
          sh -n build/ramdisk/init
          qemu-aarch64-static build/ramdisk/bin/busybox sh -n build/ramdisk/init
          (cd build/ramdisk && find . -print0 | LC_ALL=C sort -z | \
            cpio --null --create --format=newc --quiet) | \
            lz4 -l -z -c > build/u14-QEMU-ONLY-initramfs.cpio.lz4
          test -s build/u14-QEMU-ONLY-initramfs.cpio.lz4

      - name: Actual ARM64 QEMU virt boot, systemd invokes real Labwc headless compositor
        shell: bash
        run: |
          set -euxo pipefail
          set +e
          timeout -k 5 110 qemu-system-aarch64 \
            -M virt,gic-version=3 -cpu cortex-a72 -smp 2 -m 2048 \
            -nodefaults -display none -monitor none -serial stdio -nic none -no-reboot \
            -kernel inputs/kernel/build/linux-6.6.89/arch/arm64/boot/Image \
            -initrd build/u14-QEMU-ONLY-initramfs.cpio.lz4 \
            -drive if=none,format=raw,readonly=on,file=build/U14_QEMU_TEMP_GUI_ROOTFS_NOT_PIXEL8.img,id=u14disk \
            -device virtio-blk-device,drive=u14disk \
            -append 'console=ttyAMA0,115200 earlycon=pl011,0x9000000 loglevel=5 rdinit=/init u8.rootuuid=d6b067e7-31e4-4aa3-8edf-d7e70fec0747 u8.research_gate=I_UNDERSTAND_THIS_IS_UNVERIFIED systemd.unit=u14-gui.target systemd.log_target=console' \
            > output/U14_QEMU_SERIAL.log 2>&1
          rc=$?
          set -e
          echo "U14_QEMU_EXIT=$rc" > output/U14_VM_EXIT.txt
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            tail -n 100 output/U14_QEMU_SERIAL.log
            exit 1
          fi
          grep -E 'U14_|labwc|Wayland|wlroots|systemd|Failed to' \
            output/U14_QEMU_SERIAL.log | tail -n 120 || true

      - name: Require real Labwc headless Wayland registry protocol handshake (NOT screenshot)
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/u14_assert_gui_vm.py \
            --log output/U14_QEMU_SERIAL.log \
            --u6 inputs/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img \
            --guest-rootfs build/U14_QEMU_TEMP_GUI_ROOTFS_NOT_PIXEL8.img \
            --kernel inputs/kernel/build/linux-6.6.89/arch/arm64/boot/Image \
            --initramfs build/u14-QEMU-ONLY-initramfs.cpio.lz4 \
            --out output
          cat output/U14_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VM logs + reports ONLY, never firmware or flashable binary images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-u14-arm64-headless-wayland-evidence-${{ github.run_number }}
          path: |
            output/U14_REPORT.md
            output/U14_ASSERT.json
            output/U14_VM_ROOTFS_PREP.json
            output/U14_QEMU_SERIAL.log
            output/U14_VM_EXIT.txt
            output/U14_PROBE_SHA256.txt
            output/U14_PROBE_NEGATIVE.log
          retention-days: 30
          if-no-files-found: warn
