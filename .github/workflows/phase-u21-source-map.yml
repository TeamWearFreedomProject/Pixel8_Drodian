name: U21 Pixel 8 CP2A shusky source/DTBO provenance audit (NO FLASH)
on:
  pull_request:
    paths:
      - .github/workflows/phase-u21-source-map.yml
      - scripts/u21_source_map.py
      - PHASE_U21.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: u21-source-map-${{ github.ref }}
  cancel-in-progress: false
jobs:
  google-source-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch audited Google shusky and exact-source GKI research artifacts
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38099633940
          name: u17-SHUSKY-SOURCE-ONLY-DO-NOT-FLASH-4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/u17
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38101661379
          name: u18-CP2A-GKI-RESEARCH-NOT-FLASHABLE-2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/u18
      - name: Probe official Google kernel manifest shusky branch names (no guessing)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output/u21
          git ls-remote --heads https://android.googlesource.com/kernel/manifest \
            'android-gs-shusky-6.1-android*' | tee output/u21/U21_GOOGLE_BRANCH_REFS.txt
          test -s output/u21/U21_GOOGLE_BRANCH_REFS.txt
      - name: Pin manifest projects and distinguish shiba vs husky DTBO inputs
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/u21_source_map.py
          python3 scripts/u21_source_map.py \
            --u17 inputs/u17 \
            --u18 inputs/u18 \
            --refs output/u21/U21_GOOGLE_BRANCH_REFS.txt \
            --out output/u21
          python3 -m json.tool output/u21/U21_SOURCE_MAP.json >/dev/null
          cat output/u21/U21_SOURCE_MAP.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve evidence without vendor binaries or flash instructions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u21-GOOGLE-CP2A-SHUSKY-SOURCE-MAP-NOT-FLASHABLE-${{ github.run_number }}
          path: output/u21/
          retention-days: 28
          if-no-files-found: warn
