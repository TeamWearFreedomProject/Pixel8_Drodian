name: U23 real QEMU Ubuntu ARM64 U20 handoff smoke test (NO PHONE)
on:
  pull_request:
    paths:
      - .github/workflows/phase-u23-ubuntu-handoff-qemu.yml
      - scripts/u23_vm_assert.py
      - PHASE_U23.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: u23-ubuntu-qemu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-ubuntu-qemu-boot:
    name: Run corrected U20 initramfs -> Ubuntu systemd PID1 inside QEMU virt
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install generic ARM64 QEMU + offline ext4 tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm e2fsprogs lz4 cpio
          python3 -m py_compile scripts/u23_vm_assert.py
          mkdir -p input/u6 input/u9 input/u18 input/u20 stage/ramdisk output/u23
      - name: Download existing Ubuntu 26.04 2GiB ext4 image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38047914957
          name: shiba-u6-ubuntu-ext4-NOT_BOOTABLE-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/u6
      - name: Download U9 proven generic QEMU ARM64 kernel (NOT Pixel)
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38059787754
          name: u9-generic-qemu-arm64-kernel-6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/u9
      - name: Download corrected real U20 ARM64 static guarded initramfs
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38104039752
          name: u20-Ubuntu-GKI-OFFLINE-VERIFIED-DO-NOT-FLASH-3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/u20
      - name: Download U18 genuine pinned GKI source provenance report
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38101661379
          name: u18-CP2A-GKI-RESEARCH-NOT-FLASHABLE-2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/u18
      - name: Verify exact artifacts before VM, derive UUID from offline ext4 only
        shell: bash
        run: |
          set -euxo pipefail
          rootfs=input/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img
          kernel=input/u9/build/linux-6.6.89/arch/arm64/boot/Image
          initrd=input/u20/u20-REBUILT-ARM64-GUARDED-INITRAMFS-NOT_FLASHABLE.cpio.lz4
          echo "d3cbe5e0a0e170e9e1e3071b32394e0ddd686887351ed1f4aa2b8bed814bde9e  $rootfs" | sha256sum -c -
          echo "718c5584d0a1a69943c68689c0dadbd9b0ce6623e48e9a1b97429293c41efddc  $kernel" | sha256sum -c -
          echo "827ded5bce36ce87238645536a77ce3a464236edbeaaa61cd1bba617d8d72c1c  $initrd" | sha256sum -c -
          test "$(stat -c %s "$rootfs")" = 2147483648
          uuid="$(dumpe2fs -h "$rootfs" 2>/dev/null | awk '/^Filesystem UUID:/ {print $3}')"
          echo "$uuid" | grep -Eq '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'
          echo "U23_OFFLINE_UUID=$uuid" >> "$GITHUB_ENV"
      - name: Add QEMU-only console stage markers to copy of U20 reviewed /init
        shell: bash
        run: |
          set -euxo pipefail
          lz4 -dc input/u20/u20-REBUILT-ARM64-GUARDED-INITRAMFS-NOT_FLASHABLE.cpio.lz4 > stage/source.cpio
          (cd stage/ramdisk && cpio -id --no-absolute-filenames --no-preserve-owner --quiet < ../source.cpio)
          test -x stage/ramdisk/bin/busybox
          test -x stage/ramdisk/bin/u8-rootfs-probe
          python3 - <<'PY'
          from pathlib import Path
          code=Path("scripts/u8_init").read_text()
          if Path("stage/ramdisk/init").read_text()!=code:
              raise SystemExit("U20 reviewed first stage identity did not match source")
          edits=[
            ("export PATH=/bin:/sbin","export PATH=/bin:/sbin\necho U23_INIT_STARTED"),
            ('    halt_u8 "read-only rootfs mount failed"','    halt_u8 "read-only rootfs mount failed"\necho U23_ROOTFS_READONLY_MOUNTED'),
            ('    halt_u8 "wrong Ubuntu codename"','    halt_u8 "wrong Ubuntu codename"\necho U23_UBUNTU_RELEASE_VERIFIED'),
            ('exec "$BB" switch_root /newroot /sbin/init','echo U23_SWITCH_ROOT_ATTEMPT\nexec "$BB" switch_root /newroot /sbin/init'),
          ]
          for a,b in edits:
              if code.count(a)!=1: raise SystemExit("Unexpected reviewed init code: "+a)
              code=code.replace(a,b,1)
          Path("stage/ramdisk/init").write_text(code)
          Path("stage/ramdisk/init").chmod(0o755)
          PY
          sh -n stage/ramdisk/init
          (cd stage/ramdisk && find . -print0 | LC_ALL=C sort -z | cpio --null -o --format=newc --quiet) \
            | lz4 -l -z -c > stage/u23-qemu-only-initramfs.cpio.lz4
          test -s stage/u23-qemu-only-initramfs.cpio.lz4
          sha256sum stage/u23-qemu-only-initramfs.cpio.lz4 > output/u23/U23_VM_ONLY_RAMDISK_SHA256.txt
      - name: Boot negative and positive ARM64 guests (virtual readonly disk ONLY)
        shell: bash
        run: |
          set -euo pipefail
          kernel="$PWD/input/u9/build/linux-6.6.89/arch/arm64/boot/Image"
          initrd="$PWD/stage/u23-qemu-only-initramfs.cpio.lz4"
          rootfs="$PWD/input/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img"
          run_guest() {
            local label="$1" duration="$2" append="$3"
            set +e
            timeout -k 5 "$duration" qemu-system-aarch64 \
              -M virt,gic-version=3 -cpu cortex-a72 -smp 2 -m 2048 \
              -nodefaults -display none -monitor none -serial stdio -no-reboot -nic none \
              -kernel "$kernel" -initrd "$initrd" \
              -drive "if=none,format=raw,readonly=on,file=$rootfs,id=u6disk" \
              -device virtio-blk-device,drive=u6disk \
              -append "$append" > "output/u23/U23_$label.log" 2>&1
            local rc=$?
            set -e
            echo "$label: VM exit $rc" >> output/u23/U23_QEMU_EXIT_CODES.txt
            if [[ "$rc" != 0 && "$rc" != 124 ]]; then
              tail -n 40 "output/u23/U23_$label.log"
              exit 1
            fi
          }
          run_guest NEGATIVE 30 \
            "console=ttyAMA0,115200 earlycon=pl011,0x9000000 loglevel=5 rdinit=/init"
          run_guest POSITIVE 120 \
            "console=ttyAMA0,115200 earlycon=pl011,0x9000000 loglevel=6 rdinit=/init u8.rootuuid=$U23_OFFLINE_UUID u8.research_gate=I_UNDERSTAND_THIS_IS_UNVERIFIED"
          tail -n 30 output/u23/U23_POSITIVE.log
      - name: Audit real Linux boot, readonly ext4 mount and Ubuntu PID1 serial log
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/u23_vm_assert.py \
            --negative output/u23/U23_NEGATIVE.log \
            --positive output/u23/U23_POSITIVE.log \
            --kernel input/u9/build/linux-6.6.89/arch/arm64/boot/Image \
            --rootfs input/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img \
            --u20init input/u20/u20-REBUILT-ARM64-GUARDED-INITRAMFS-NOT_FLASHABLE.cpio.lz4 \
            --instrumented stage/u23-qemu-only-initramfs.cpio.lz4 \
            --u18report input/u18/U18_CP2A_GKI_REPORT.json \
            --u20report input/u20/U20_OFFLINE_INTEGRATION.json \
            --out output/u23
          cat output/u23/U23_BOOT_HANDOFF.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save QEMU console and audit reports (no kernel flashing material)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u23-QEMU-UBUNTU-BOOT-EVIDENCE-NOT-PIXEL-${{ github.run_number }}
          path: output/u23/
          retention-days: 28
          if-no-files-found: warn
