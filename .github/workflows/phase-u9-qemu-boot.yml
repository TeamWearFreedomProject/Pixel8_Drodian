name: Pixel 8 Ubuntu U9 - real QEMU ARM64 boot test (NO PHONE)

on:
  workflow_dispatch:
  push:
    paths:
      - PHASE_U9.md

permissions:
  contents: read
  actions: read

concurrency:
  group: shiba-u9-qemu-virt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qemu-native-boot-test:
    name: ARM64 kernel -> U8 ramdisk -> U6 ext4 -> systemd (QEMU virt only)
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout research scripts
        uses: actions/checkout@v4

      - name: Check script syntax and install ARM64 cross-compiler and QEMU
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/u9_vm_assert.py
          bash -n scripts/u9_vm_run.sh
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential gcc-aarch64-linux-gnu \
            libssl-dev libelf-dev ca-certificates curl xz-utils \
            e2fsprogs qemu-system-arm qemu-user-static cpio lz4
          mkdir -p inputs/u6 inputs/u8 build ramdisk output
          df -h /

      - name: Get the exact previously checked U6 ext4 root filesystem
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38047914957
          name: shiba-u6-ubuntu-ext4-NOT_BOOTABLE-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/u6

      - name: Get the exact U8 guarded initramfs
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38052743722
          name: shiba-u8-initramfs-RESEARCH-DO_NOT_FLASH-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/u8

      - name: Verify both actual source archives with pinned hashes
        shell: bash
        run: |
          set -euxo pipefail
          echo 'd3cbe5e0a0e170e9e1e3071b32394e0ddd686887351ed1f4aa2b8bed814bde9e  inputs/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img' | sha256sum -c -
          echo 'dc50919b6a4e89dc8c27d84dee5335105c756573ef3dcf74c3465a414e50372b  inputs/u8/u8-ubuntu-rootfs-handoff-UNVERIFIED-INITRAMFS_ONLY.cpio.lz4' | sha256sum -c -
          test "$(stat -c %s inputs/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img)" = 2147483648
          sudo dumpe2fs -h inputs/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img 2>/dev/null \
            | grep -E 'Filesystem UUID:|Filesystem volume name:' | tee output/U9_U6_EXT4_METADATA.txt
          uuid=$(sudo dumpe2fs -h inputs/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img 2>/dev/null \
            | awk '/^Filesystem UUID:/ {print $3}')
          echo "$uuid" | grep -Eq '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'
          echo "U9_VOLUME_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Download official stable kernel source for generic QEMU guest
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --connect-timeout 30 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.89.tar.xz \
            -o build/linux-6.6.89.tar.xz
          sha256sum build/linux-6.6.89.tar.xz | tee output/U9_KERNEL_SOURCE_SHA256.txt
          tar -xf build/linux-6.6.89.tar.xz -C build
          test -x build/linux-6.6.89/scripts/config
          df -h /

      - name: Restore previously compiled generic QEMU kernel cache
        id: guest-kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-6.6.89/arch/arm64/boot/Image
            build/linux-6.6.89/.config
          key: u9-generic-qemu-aarch64-linux-6.6.89-kconfig-v1

      - name: Build custom generic ARM64 kernel with required guest filesystem drivers built in
        if: steps.guest-kernel-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          cd build/linux-6.6.89
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --file .config \
            -e VIRTIO -e VIRTIO_MMIO -e VIRTIO_BLK \
            -e EXT4_FS -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e BLK_DEV_INITRD -e RD_LZ4 \
            -e PROC_FS -e SYSFS -e TMPFS \
            -e SERIAL_AMBA_PL011 -e SERIAL_AMBA_PL011_CONSOLE \
            -e BINFMT_ELF -e CGROUPS -e FHANDLE
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          for cfg in VIRTIO VIRTIO_MMIO VIRTIO_BLK EXT4_FS DEVTMPFS BLK_DEV_INITRD RD_LZ4 SERIAL_AMBA_PL011_CONSOLE; do
            grep -qx "CONFIG_$cfg=y" .config || { echo "::error::Required kernel built-in $cfg missing"; exit 1; }
          done
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j4 Image \
            2>&1 | tee "$GITHUB_WORKSPACE/output/U9_KERNEL_COMPILE.log"
          test -s arch/arm64/boot/Image
          sha256sum arch/arm64/boot/Image | tee "$GITHUB_WORKSPACE/output/U9_KERNEL_SHA256.txt"
          cp .config "$GITHUB_WORKSPACE/output/U9_QEMU_ONLY_KERNEL_CONFIG"
          df -h /

      - name: Cache compiled guest kernel for future quick QEMU retries
        if: steps.guest-kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-6.6.89/arch/arm64/boot/Image
            build/linux-6.6.89/.config
          key: u9-generic-qemu-aarch64-linux-6.6.89-kconfig-v1

      - name: Verify cached or newly built guest kernel
        shell: bash
        run: |
          set -euxo pipefail
          test -s build/linux-6.6.89/arch/arm64/boot/Image
          test -s build/linux-6.6.89/.config
          sha256sum build/linux-6.6.89/arch/arm64/boot/Image > output/U9_KERNEL_SHA256.txt
          cp build/linux-6.6.89/.config output/U9_QEMU_ONLY_KERNEL_CONFIG

      - name: Repack U8 initramfs with QEMU test markers, no phone-specific firmware
        shell: bash
        run: |
          set -euxo pipefail
          lz4 -dc inputs/u8/u8-ubuntu-rootfs-handoff-UNVERIFIED-INITRAMFS_ONLY.cpio.lz4 \
            > build/u8-original.cpio
          (cd ramdisk && cpio --extract --make-directories --no-absolute-filenames --quiet \
            < ../build/u8-original.cpio)
          test -x ramdisk/bin/busybox
          python3 - <<'PY'
          from pathlib import Path
          src=Path("scripts/u8_init").read_text()
          changes=[
              ("export PATH=/bin:/sbin",
               "export PATH=/bin:/sbin\necho U9_INIT_STARTED"),
              ('    halt_u8 "read-only rootfs mount failed"',
               '    halt_u8 "read-only rootfs mount failed"\necho U9_ROOTFS_READONLY_MOUNTED'),
              ('    halt_u8 "wrong Ubuntu codename"',
               '    halt_u8 "wrong Ubuntu codename"\necho U9_UBUNTU_RELEASE_VERIFIED'),
              ('    listing=$("$BB" blkid 2>/dev/null || :)',
               '    listing=$("$BB" blkid 2>/dev/null || :)\necho U9_DISK_DIAGNOSTIC_BEGIN\n"$BB" cat /proc/partitions\n"$BB" ls -l /dev/vda\n"$BB" blkid /dev/vda || :\necho U9_DISK_DIAGNOSTIC_END'),
              ('exec "$BB" switch_root /newroot /sbin/init',
               'echo U9_SWITCH_ROOT_ATTEMPT\nexec "$BB" switch_root /newroot /sbin/init'),
          ]
          for original, replacement in changes:
              if original not in src: raise SystemExit("Instrumentation marker missing: "+original)
              src=src.replace(original,replacement,1)
          target=Path("ramdisk/init")
          target.write_text(src)
          target.chmod(0o755)
          PY
          sh -n ramdisk/init
          qemu-aarch64-static ramdisk/bin/busybox sh -n ramdisk/init
          (cd ramdisk && find . -print0 | LC_ALL=C sort -z | \
            cpio --null --create --format=newc --quiet) | \
            lz4 -l -z -c > build/u9-VIRTUAL_MACHINE_ONLY-initramfs.cpio.lz4
          test -s build/u9-VIRTUAL_MACHINE_ONLY-initramfs.cpio.lz4
          sha256sum build/u9-VIRTUAL_MACHINE_ONLY-initramfs.cpio.lz4 \
            | tee output/U9_GUEST_RAMDISK_SHA256.txt

      - name: Boot negative and positive QEMU ARM64 guests, with readonly U6 disk
        shell: bash
        env:
          U9_OUT: ${{ github.workspace }}/output
          U9_KERNEL: ${{ github.workspace }}/build/linux-6.6.89/arch/arm64/boot/Image
          U9_RAMDISK: ${{ github.workspace }}/build/u9-VIRTUAL_MACHINE_ONLY-initramfs.cpio.lz4
          U9_ROOT_IMG: ${{ github.workspace }}/inputs/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img
        run: |
          set -euxo pipefail
          bash scripts/u9_vm_run.sh

      - name: Assert real guest boot, Linux rootfs read-only mount and Ubuntu PID1 logs
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/u9_vm_assert.py \
            --negative output/U9_NEGATIVE.log \
            --positive output/U9_POSITIVE.log \
            --rootfs inputs/u6/ubuntu-26.04-shiba-arm64-rootfs-DATA_ONLY-NOT_BOOTABLE.img \
            --kernel build/linux-6.6.89/arch/arm64/boot/Image \
            --initramfs build/u9-VIRTUAL_MACHINE_ONLY-initramfs.cpio.lz4 \
            --out output
          python3 -m json.tool output/U9_RESULTS.json >/dev/null
          cat output/U9_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive the reusable QEMU-only kernel (not a Pixel kernel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u9-generic-qemu-arm64-kernel-${{ github.run_number }}
          path: |
            build/linux-6.6.89/arch/arm64/boot/Image
            output/U9_QEMU_ONLY_KERNEL_CONFIG
            output/U9_KERNEL_SHA256.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Keep only QEMU logs, generic kernel config and evidence (not any phone image)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-u9-qemu-boot-test-evidence-${{ github.run_number }}
          path: |
            output/U9_REPORT.md
            output/U9_RESULTS.json
            output/U9_NEGATIVE.log
            output/U9_POSITIVE.log
            output/U9_RUN_STATUS.txt
            output/U9_KERNEL_SOURCE_SHA256.txt
            output/U9_KERNEL_SHA256.txt
            output/U9_GUEST_RAMDISK_SHA256.txt
            output/U9_U6_EXT4_METADATA.txt
            output/U9_QEMU_ONLY_KERNEL_CONFIG
          if-no-files-found: warn
          retention-days: 30
